name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest is 26.04, which has no Python 3.9 builds; 24.04 does.
        os: [ubuntu-24.04]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        # macOS runners are scarce: the oldest and newest Python only. macOS ships 3.9 as its
        # own python3, and 3.9 has no arm64 build for setup-python, so that job runs x64 (Rosetta).
        include:
          - os: macos-latest
            python: "3.9"
            arch: x64
          - os: macos-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}
      - name: Unit tests
        working-directory: tests
        run: python -m unittest discover -v
      - name: Config JSON is valid
        run: |
          python -m json.tool .claude-plugin/marketplace.json > /dev/null
          python -m json.tool plugins/berth/.claude-plugin/plugin.json > /dev/null
          python -m json.tool plugins/berth/hooks/hooks.json > /dev/null
      - name: Vendored copies match VENDORED.md
        run: |
          python - <<'PY'
          import hashlib, re
          rows = re.findall(r"\| `(plugins/[^`]+)` \| `[^`]+` \| `([0-9a-f]{64})` \| verbatim \|", open("VENDORED.md").read())
          assert rows, "no verbatim rows found"
          for path, digest in rows:
              got = hashlib.sha256(open(path, "rb").read()).hexdigest()
              assert got == digest, "%s: %s != %s" % (path, got, digest)
          print("%d vendored files match" % len(rows))
          PY
