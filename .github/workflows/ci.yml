name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        working-directory: tests
        run: python -m unittest discover -v
      - name: Config JSON is valid
        run: |
          python -m json.tool .claude-plugin/marketplace.json > /dev/null
          python -m json.tool plugins/berth/.claude-plugin/plugin.json > /dev/null
          python -m json.tool plugins/berth/hooks/hooks.json > /dev/null
      - name: Vendored copies match VENDORED.md
        run: |
          python - <<'PY'
          import hashlib, re
          rows = re.findall(r"\| `(plugins/[^`]+)` \| `[^`]+` \| `([0-9a-f]{64})` \| verbatim \|", open("VENDORED.md").read())
          assert rows, "no verbatim rows found"
          for path, digest in rows:
              got = hashlib.sha256(open(path, "rb").read()).hexdigest()
              assert got == digest, "%s: %s != %s" % (path, got, digest)
          print("%d vendored files match" % len(rows))
          PY
